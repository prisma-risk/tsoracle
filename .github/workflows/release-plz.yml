name: release-plz

on:
  push:
    branches:
      - main

# Tighten default token scope; each job opts in to what it needs.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Publishes (tags + cargo publish + GitHub Release) whenever the release PR
  # has been merged into main. No-op on every other push.
  release:
    name: release-plz release
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      id-token: write  # for Sigstore gitsign OIDC (signs release tags)
    # Queue serial — never cancel a publish in flight (a half-done publish
    # could leave the repo with some crates released and others not).
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - name: system deps
        timeout-minutes: 5
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05  # v1.6.0
        with:
          packages: protobuf-compiler clang libclang-dev
          version: 1
      # Install Sigstore gitsign so release-plz creates annotated, keyless-signed
      # tags. Signing identity = this workflow's GitHub Actions OIDC token,
      # attested by Fulcio and logged to Rekor (same trust model as the SLSA
      # provenance signed by .github/workflows/release-sign.yml).
      - name: install gitsign
        env:
          GITSIGN_VERSION: "0.16.0"
          GITSIGN_SHA256: "176b77ae1cf57ac73343c378e2f1338346930324bfb20408b600d97d21e45aa1"
        run: |
          set -euo pipefail
          asset="gitsign_${GITSIGN_VERSION}_linux_amd64"
          curl -sSLo /tmp/gitsign "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/${asset}"
          echo "${GITSIGN_SHA256}  /tmp/gitsign" | sha256sum -c -
          sudo install -m 0755 /tmp/gitsign /usr/local/bin/gitsign
          rm -f /tmp/gitsign
          gitsign --version
      - name: configure git to sign tags via gitsign
        run: |
          set -euo pipefail
          git config --global gpg.x509.program gitsign
          git config --global gpg.format x509
          git config --global tag.gpgSign true
      - uses: release-plz/action@064f4d1e36c843611ddf013be726beaa4ad804db  # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Opens or updates the release PR whenever main moves. The PR contains the
  # version bumps + CHANGELOG diffs; merging it triggers the `release` job
  # above on the next push.
  release-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - name: system deps
        timeout-minutes: 5
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05  # v1.6.0
        with:
          packages: protobuf-compiler clang libclang-dev
          version: 1
      - uses: release-plz/action@064f4d1e36c843611ddf013be726beaa4ad804db  # v0.5
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # `fuzz/` is its own cargo workspace (cargo-fuzz convention) and
      # path-depends on workspace crates. When release-plz bumps a workspace
      # crate's `[package].version`, fuzz/Cargo.lock keeps the pre-bump pin
      # and the CI `fuzz lockfile` guard (ci.yml) fails on the release PR.
      # Resync the lock on top of the release branch so the PR ships green.
      - name: sync fuzz/Cargo.lock onto release PR
        env:
          RELEASE_PRS: ${{ steps.release-plz.outputs.prs }}
          GIT_AUTHOR_NAME: release-plz[bot]
          GIT_AUTHOR_EMAIL: release-plz[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: release-plz[bot]
          GIT_COMMITTER_EMAIL: release-plz[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_PRS:-}" ] || [ "${RELEASE_PRS}" = "[]" ]; then
            echo "release-plz did not open/update a PR; nothing to sync."
            exit 0
          fi
          branch="$(jq -r '.[0].head_branch // empty' <<<"$RELEASE_PRS")"
          if [ -z "$branch" ]; then
            echo "release-plz outputs did not include a head_branch; nothing to sync."
            exit 0
          fi
          git fetch origin "$branch"
          git checkout "$branch"
          (cd fuzz && cargo update --workspace)
          if git diff --quiet -- fuzz/Cargo.lock; then
            echo "fuzz/Cargo.lock already in sync."
            exit 0
          fi
          git commit -m 'chore(fuzz): resync fuzz/Cargo.lock with workspace bumps' -- fuzz/Cargo.lock
          git push origin "$branch"
