[package]
name = "stress"
description = "tsoracle stress + chaos harness: load × nemesis × invariant checking. Not a published crate."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme.workspace       = true
publish = false

[features]
default = []
# Enables in-process failpoint chaos in mem/raft topologies. When off,
# `arm_failpoint`/`disarm_failpoint` log a warning and return Skipped.
stress-failpoints = [
    "dep:fail",
    "tsoracle-server/failpoints",
    "tsoracle-paxos-toolkit/failpoints",
]

[dependencies]
anyhow             = { workspace = true }
async-trait        = { workspace = true }
clap               = { workspace = true, features = ["derive"] }
hdrhistogram       = { workspace = true }
humantime          = { workspace = true }
humantime-serde    = { workspace = true }
omnipaxos          = { workspace = true, features = ["serde"] }
openraft           = { workspace = true }
parking_lot        = { workspace = true }
rand               = { workspace = true }
rocksdb            = { workspace = true }
serde              = { workspace = true, features = ["derive"] }
serde_json         = { workspace = true }
tempfile           = { workspace = true }
tokio              = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "process", "io-util"] }
tonic              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

tsoracle-client          = { path = "../../crates/tsoracle-client", version = "1.2.0" }
tsoracle-consensus       = { path = "../../crates/tsoracle-consensus", version = "2.1.0" }
tsoracle-core            = { path = "../../crates/tsoracle-core", version = "2.2.0" }
tsoracle-driver-openraft = { path = "../../crates/tsoracle-driver-openraft", version = "2.2.0" }
tsoracle-driver-paxos    = { path = "../../crates/tsoracle-driver-paxos", version = "2.0.2" }
tsoracle-openraft-toolkit = { path = "../../crates/tsoracle-openraft-toolkit", version = "1.2.0", features = ["test-fakes"] }
tsoracle-paxos-toolkit   = { path = "../../crates/tsoracle-paxos-toolkit", version = "1.0.4", features = ["rocksdb-storage", "test-fakes"] }
tsoracle-server          = { path = "../../crates/tsoracle-server", version = "3.1.0", features = ["test-fakes"] }

fail = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "process", "io-util", "test-util"] }

[[bin]]
name = "stress"
path = "src/bin/stress.rs"
