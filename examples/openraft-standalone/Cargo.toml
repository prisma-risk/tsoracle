[package]
name                   = "example-openraft-standalone"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description            = "tsoracle example: HA via openraft, 3-node multi-process cluster (uses tsoracle-driver-openraft)"
publish                = false

[[bin]]
name = "openraft-standalone"
path = "src/main.rs"

[features]
default    = []
reflection = ["tsoracle-server/reflection"]

[dependencies]
tsoracle-core            = { path = "../../crates/tsoracle-core", version = "0.2.1" }
tsoracle-consensus       = { path = "../../crates/tsoracle-consensus", version = "0.1.6" }
tsoracle-server          = { path = "../../crates/tsoracle-server", version = "0.2.4" }
tsoracle-driver-openraft = { path = "../../crates/tsoracle-driver-openraft", version = "0.2.2" }
tsoracle-openraft-toolkit         = { path = "../../crates/tsoracle-openraft-toolkit", version = "0.1.7", features = ["rocksdb-log-store"] }

openraft           = { workspace = true }
rocksdb            = { workspace = true }
tonic              = { workspace = true }
tonic-prost        = { workspace = true }
prost              = { workspace = true }
tokio              = { workspace = true, features = ["signal"] }
tokio-stream       = { workspace = true }
futures            = { workspace = true }
async-trait        = { workspace = true }
clap               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
postcard           = { workspace = true }
anyhow             = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }
