[package]
name         = "tsoracle"
version      = "0.1.9"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description  = "Standalone timestamp oracle server"
publish      = true

[[bin]]
name = "tsoracle"
path = "src/main.rs"

[features]
default    = []
reflection = ["tsoracle-server/reflection"]
# Capture backtraces in instrumented error variants. Fans out to every
# direct dependency that exposes a `bt` feature. Runtime capture is still
# gated by `RUST_BACKTRACE`/`RUST_LIB_BACKTRACE`.
bt         = ["tsoracle-core/bt", "tsoracle-server/bt", "tsoracle-driver-file/bt"]

[dependencies]
anyhow                = "1"
humantime             = "2"
clap                  = { workspace = true }
tokio                 = { workspace = true, features = ["signal"] }
tracing               = { workspace = true }
tracing-subscriber    = { workspace = true }
tsoracle-core         = { path = "../tsoracle-core", version = "0.2.1" }
tsoracle-server       = { path = "../tsoracle-server", version = "0.2.4" }
tsoracle-driver-file = { path = "../tsoracle-driver-file", version = "0.1.6" }

[dev-dependencies]
tsoracle-client    = { path = "../tsoracle-client", version = "0.2.2" }
tsoracle-consensus = { path = "../tsoracle-consensus", version = "0.1.6" }
async-trait        = { workspace = true }
futures            = { workspace = true }
parking_lot        = { workspace = true }
tokio-stream       = { workspace = true }
tempfile           = { workspace = true }
tokio              = { workspace = true, features = ["process"] }
