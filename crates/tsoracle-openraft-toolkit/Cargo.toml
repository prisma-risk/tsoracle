[package]
name         = "tsoracle-openraft-toolkit"
description  = "Reusable openraft glue: TypeConfig macro, RocksDB log store, lifecycle helpers"
version      = "0.2.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme.workspace       = true
authors.workspace      = true
documentation = "https://docs.rs/tsoracle-openraft-toolkit"
keywords      = ["openraft", "raft", "consensus", "rocksdb", "storage"]
categories    = ["asynchronous", "database-implementations"]

[package.metadata.docs.rs]
features     = ["rocksdb-log-store"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default            = ["rocksdb-log-store"]
rocksdb-log-store  = ["dep:rocksdb"]
test-fakes         = ["dep:parking_lot"]
failpoints         = ["tsoracle-failpoint/failpoints"]

[dependencies]
async-trait      = { workspace = true }
futures          = { workspace = true }
openraft         = { workspace = true }
parking_lot      = { workspace = true, optional = true }
rocksdb          = { workspace = true, optional = true, features = ["multi-threaded-cf"] }
serde            = { workspace = true }
thiserror        = { workspace = true }
tokio            = { workspace = true }
tracing          = { workspace = true }
tsoracle-codec     = { workspace = true }
tsoracle-failpoint = { workspace = true }

[dev-dependencies]
openraft         = { workspace = true, features = ["serde", "type-alias"] }
parking_lot      = { workspace = true }
postcard         = { workspace = true }
proptest         = { workspace = true }
rocksdb          = { workspace = true }
tempfile         = { workspace = true }
tokio            = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[[test]]
name              = "failpoints"
path              = "tests/failpoints.rs"
required-features = ["failpoints", "rocksdb-log-store"]
