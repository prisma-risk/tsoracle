[package]
name         = "tsoracle-driver-openraft"
description  = "openraft-backed ConsensusDriver for tsoracle"
version      = "2.0.0"
readme       = "README.md"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[features]
default                = ["rocksdb-snapshot-store"]
# Enables `RocksdbSnapshotStore`, a `SnapshotStore` impl keyed in a
# caller-managed RocksDB column family. Pairs naturally with
# `tsoracle_openraft_toolkit::RocksdbLogStore` so one `Arc<DB>` covers both the
# raft log and the persisted snapshot. Default-on because the two example
# crates in this workspace both use the rocksdb-backed log store anyway;
# downstream consumers that want a custom snapshot backend can opt out via
# `default-features = false`.
rocksdb-snapshot-store = ["dep:rocksdb"]
# Emit format-migration observability through the `metrics` crate facade
# (gauges for the version state, counters for the SetFormatVersion
# lifecycle). Off by default so embedders that do not want the `metrics`
# dependency are unaffected, matching `tsoracle-server`'s `metrics` feature.
metrics                = ["dep:metrics"]
# Test-only harness affordance: adds `BASELINE_WRITE_VERSION + 1` alias
# arms to the per-version codec dispatch (`HighWaterStateMachineSnapshot`
# / `PersistedSnapshot`) that delegate to the baseline body, and
# propagates the matching toolkit feature so `MAX_READABLE_VERSION` rises
# to `BASELINE + 1`. The aliased body is byte-identical to baseline; the
# only difference is the leading version byte. This lets a mixed-version
# e2e harness drive a real activation flip from baseline to the next
# version end-to-end (gate -> propose -> commit -> apply -> cell flip)
# without shipping a real new format. Off by default; never compiled
# into production. The arm guard derives from `BASELINE_WRITE_VERSION`
# so a future baseline bump moves the alias version with no edit here.
e2e-max-readable-next  = ["tsoracle-openraft-toolkit/e2e-max-readable-next"]

[dependencies]
async-trait        = { workspace = true }
futures            = { workspace = true }
metrics            = { workspace = true, optional = true }
openraft           = { workspace = true }
postcard           = { workspace = true }
# `default-features = false` so this crate does not unilaterally pull the
# toolkit's `rocksdb-log-store` feature (and its transitive `librocksdb-sys` →
# `bindgen` → `clang-sys` chain) into every consumer. The driver's `src/` only
# touches `tsoracle_openraft_toolkit::{LeadershipState, lifecycle, declare_raft_types_ext}`,
# all of which live outside the feature-gated `log_store` module. Workspace
# members that need `RocksdbLogStore` (examples, this crate's dev-deps) opt in
# explicitly with `features = ["rocksdb-log-store"]` and cargo feature
# unification re-enables it for their builds.
tsoracle-openraft-toolkit   = { path = "../tsoracle-openraft-toolkit", version = "1.1.0", default-features = false }
parking_lot        = { workspace = true }
rocksdb            = { workspace = true, optional = true, features = ["multi-threaded-cf"] }
serde              = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tsoracle-codec     = { workspace = true }
tsoracle-consensus = { path = "../tsoracle-consensus", version = "2.0.0", features = ["serde"] }
tsoracle-core      = { path = "../tsoracle-core", version = "2.1.0", features = ["serde"] }

[dev-dependencies]
anyhow           = { workspace = true }
tsoracle-openraft-toolkit = { path = "../tsoracle-openraft-toolkit", version = "1.1.0", features = ["rocksdb-log-store", "test-fakes"] }
metrics-util     = { workspace = true }
proptest         = { workspace = true }
rocksdb          = { workspace = true }
tempfile         = { workspace = true }
tokio            = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = { workspace = true }
