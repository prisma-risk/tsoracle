# Generated by scripts/render-pr-review-issues.py in prisma-risk/shared-workflows.
name: PR review issues

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-review-issue-${{ github.event_name }}-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  create-issue:
    if: >-
      startsWith(github.event.comment.body, '/issue') && (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture review follow-up
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            // Executed by actions/github-script; comment text is data, never executable code.
            const {owner, repo} = context.repo;
            const event = context.eventName;
            if (!['issue_comment', 'pull_request_review_comment'].includes(event)) return;
            const inline = event === 'pull_request_review_comment';
            const number = inline ? context.payload.pull_request?.number :
              (context.payload.issue?.pull_request ? context.payload.issue.number : null);
            if (!number || !['created', 'edited'].includes(context.payload.action)) return;
            const id = context.payload.comment.id;
            const command = inline
              ? (await github.rest.pulls.getReviewComment({owner, repo, comment_id: id})).data
              : (await github.rest.issues.getComment({owner, repo, comment_id: id})).data;
            const match = /^\/issue(?:[ \t]+([^\r\n]*))?(?:\r?\n([\s\S]*))?$/.exec(command.body.trim());
            if (!match || command.user.type === 'Bot') return;
            // The actor must own the command; an edit by someone else must not impersonate it.
            if (context.actor !== command.user.login) return;
            const {data: access} = await github.rest.repos.getCollaboratorPermissionLevel({
              owner, repo, username: command.user.login,
            });
            if (!['admin', 'maintain', 'write'].includes(access.permission)) {
              core.notice('The /issue command requires repository write access.');
              return;
            }
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number});
            if (pr.base.repo.full_name.toLowerCase() !== `${owner}/${repo}`.toLowerCase()) {
              throw new Error('Pull request does not belong to the triggering repository.');
            }
            if (inline && command.pull_request_url !== pr.url) {
              throw new Error('Review comment does not belong to the triggering pull request.');
            }
            if (!inline && command.issue_url !== `${context.apiUrl}/repos/${owner}/${repo}/issues/${number}`) {
              throw new Error('Comment does not belong to the triggering pull request.');
            }
            // Fork/Dependabot review events have read-only tokens. A conversation command
            // can quote the review permalink and runs with the base repository's token.
            if (inline && (pr.head.repo?.full_name !== pr.base.repo.full_name || pr.user.login === 'dependabot[bot]')) {
              core.setFailed('For fork or Dependabot PRs, post /issue in the PR Conversation tab and include the review comment permalink.');
              return;
            }
            let source = inline ? command : null;
            if (!inline) {
              const escaped = `${context.serverUrl}/${owner}/${repo}/pull/${number}`.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const linked = new RegExp(`${escaped}(?:/files)?#discussion_r([0-9]+)\\b`).exec(command.body);
              if (linked) {
                source = (await github.rest.pulls.getReviewComment({owner, repo, comment_id: Number(linked[1])})).data;
                if (source.pull_request_url !== pr.url) throw new Error('Linked comment belongs to a different PR.');
              }
            }
            let thread = [];
            if (source) {
              const rootId = source.in_reply_to_id || source.id;
              thread = (await github.paginate(github.rest.pulls.listReviewComments, {
                owner, repo, pull_number: number, per_page: 100,
              })).filter(comment => comment.id === rootId || comment.in_reply_to_id === rootId);
              source = thread.find(comment => comment.id === rootId) || source;
            }
            const title = (match[1]?.trim() || source?.body.split('\n').find(line => line.trim() && !line.startsWith('/issue')) ||
              `Follow-up: ${pr.title}`).slice(0, 256);
            const marker = `<!-- pr-review-issue:${inline ? 'review' : 'conversation'}:${id} -->`;
            const label = 'review-followup';
            // List rather than search: freshly created issues need not be indexed yet.
            let issue = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', labels: label, per_page: 100,
            })).find(item => !item.pull_request && item.body?.includes(marker));
            if (!issue) {
              const quote = text => String(text || '').split('\n').map(line => `> ${line}`).join('\n');
              const sections = [marker, `Requested by @${command.user.login} in [PR #${number}: ${pr.title}](${pr.html_url}).`,
                `Original command: ${command.html_url}`, '## Follow-up', quote(command.body)];
              if (pr.body) sections.push('## Pull request context', quote(pr.body.slice(0, 8000)));
              if (source) {
                const commit = source.original_commit_id || source.commit_id;
                const line = source.original_line || source.line;
                const file = source.path.split('/').map(encodeURIComponent).join('/');
                const url = `${context.serverUrl}/${owner}/${repo}/blob/${commit}/${file}${line ? `#L${line}` : ''}`;
                sections.push('## Code context', `[${source.path}](${url})`, `Review thread: ${source.html_url}`);
                if (source.diff_hunk) {
                  const fence = '`'.repeat(Math.max(3, ...[...source.diff_hunk.matchAll(/`+/g)].map(m => m[0].length + 1)));
                  sections.push(`${fence}diff\n${source.diff_hunk}\n${fence}`);
                }
                sections.push('## Review conversation');
                for (const comment of thread) {
                  if (comment.id === command.id || comment.user.type === 'Bot') continue;
                  sections.push(`@${comment.user.login} — ${comment.html_url}`, quote(comment.body));
                }
              }
              let body = sections.join('\n\n');
              if (body.length > 60000) body = body.slice(0, 59000) + '\n\n_Context truncated; follow the original comment links for the full discussion._';
              try {
                await github.rest.issues.getLabel({owner, repo, name: label});
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({owner, repo, name: label, color: '5319e7', description: 'Follow-up captured during pull request review'});
                } catch (error) {
                  if (error.status !== 422) throw error;
                  await github.rest.issues.getLabel({owner, repo, name: label});
                }
              }
              issue = (await github.rest.issues.create({owner, repo, title, body, labels: [label]})).data;
            }
            const replyMarker = `<!-- pr-review-issue-reply:${inline ? 'review' : 'conversation'}:${id} -->`;
            const replies = await github.paginate(inline ? github.rest.pulls.listReviewComments : github.rest.issues.listComments,
              {owner, repo, ...(inline ? {pull_number: number} : {issue_number: number}), per_page: 100});
            if (!replies.some(comment => comment.body?.includes(replyMarker))) {
              const body = `${replyMarker}\nCreated follow-up issue: ${issue.html_url}`;
              if (inline) {
                await github.rest.pulls.createReplyForReviewComment({owner, repo, pull_number: number,
                  comment_id: command.in_reply_to_id || command.id, body});
              } else {
                await github.rest.issues.createComment({owner, repo, issue_number: number, body});
              }
            }
            core.notice(`Follow-up issue: ${issue.html_url}`);
