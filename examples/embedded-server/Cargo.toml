[package]
name                   = "example-embedded-server"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description            = "tsoracle example: embed FileDriver in your own binary with graceful shutdown"
publish                = false

[dependencies]
tsoracle-server      = { path = "../../crates/tsoracle-server", version = "3.2.2", features = ["reflection"] }
tsoracle-driver-file = { path = "../../crates/tsoracle-driver-file", version = "2.2.0" }
tokio                 = { workspace = true, features = ["signal"] }
tracing               = { workspace = true }
tracing-subscriber    = { workspace = true }
anyhow                = { workspace = true }
