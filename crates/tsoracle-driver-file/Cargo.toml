[package]
name         = "tsoracle-driver-file"
version      = "2.0.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme                 = "README.md"
description  = "Single-node fsync-durable file driver (ConsensusDriver impl) for tsoracle."
documentation = "https://docs.rs/tsoracle-driver-file"
keywords      = ["tsoracle", "wal", "storage", "fsync", "driver"]
categories    = ["database-implementations", "filesystem"]

[features]
default    = []
failpoints = ["tsoracle-failpoint/failpoints"]

[package.metadata.docs.rs]
all-features = false
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
async-trait        = { workspace = true }
crc32c             = { workspace = true }
fs2                = "0.4"
futures            = { workspace = true }
libc               = "0.2"
thiserror          = { workspace = true }
tokio              = { workspace = true }
tokio-stream       = { workspace = true }
tsoracle-core      = { path = "../tsoracle-core", version = "2.1.0" }
tsoracle-consensus = { path = "../tsoracle-consensus", version = "2.0.0" }
tsoracle-failpoint = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["test-util"] }

[[test]]
name              = "failpoints"
path              = "tests/failpoints.rs"
required-features = ["failpoints"]

[[test]]
name              = "dense_failpoints"
path              = "tests/dense_failpoints.rs"
required-features = ["failpoints"]
