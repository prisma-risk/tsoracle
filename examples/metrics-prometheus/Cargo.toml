[package]
name                   = "example-metrics-prometheus"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description            = "tsoracle example: embed the server with the metrics feature and expose a Prometheus /metrics endpoint"
publish                = false

[dependencies]
tsoracle-server      = { path = "../../crates/tsoracle-server", version = "2.0.0", features = ["metrics"] }
tsoracle-driver-file = { path = "../../crates/tsoracle-driver-file", version = "1.0.1" }
tsoracle-client      = { path = "../../crates/tsoracle-client", version = "1.0.1" }
metrics-exporter-prometheus = { workspace = true }
tokio                = { workspace = true, features = ["signal"] }
tracing              = { workspace = true }
tracing-subscriber   = { workspace = true }
anyhow               = { workspace = true }
