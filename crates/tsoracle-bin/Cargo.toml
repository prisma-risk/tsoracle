[package]
name         = "tsoracle"
version      = "0.1.14"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description  = "Standalone timestamp oracle server"
readme       = "README.md"
publish      = true

[[bin]]
name = "tsoracle"
path = "src/main.rs"

[features]
default    = ["file", "openraft", "paxos"]
file       = ["tsoracle-standalone/file"]
openraft   = ["tsoracle-standalone/openraft"]
paxos      = ["tsoracle-standalone/paxos"]
reflection = ["tsoracle-server/reflection"]
bt         = ["tsoracle-core/bt", "tsoracle-server/bt"]
# Pass through `e2e-max-readable-next` to the standalone crate so the
# production image (`deploy/Dockerfile` passing `--build-arg FEATURES=...`)
# can opt in for the mixed-version kube-e2e lane. NEVER set in production
# builds — see `tsoracle-openraft-toolkit` Cargo.toml for the safety
# contract.
e2e-max-readable-next = ["tsoracle-standalone/e2e-max-readable-next"]

[dependencies]
anyhow                = "1"
humantime             = "2"
clap                  = { workspace = true }
tokio                 = { workspace = true, features = ["signal"] }
tracing               = { workspace = true }
tracing-subscriber    = { workspace = true }
tonic                 = { workspace = true, features = ["tls-aws-lc"] }
tsoracle-core         = { path = "../tsoracle-core", version = "0.2.5" }
tsoracle-server       = { path = "../tsoracle-server", version = "0.2.9" }
tsoracle-standalone   = { path = "../tsoracle-standalone", version = "0.1.3", default-features = false }

[dev-dependencies]
tsoracle-client    = { path = "../tsoracle-client", version = "0.2.6" }
tsoracle-consensus = { path = "../tsoracle-consensus", version = "0.1.10" }
tsoracle-driver-file = { path = "../tsoracle-driver-file", version = "0.1.10" }
async-trait        = { workspace = true }
futures            = { workspace = true }
parking_lot        = { workspace = true }
rcgen              = { workspace = true }
tokio-stream       = { workspace = true }
tempfile           = { workspace = true }
tokio              = { workspace = true, features = ["process"] }
