[package]
name         = "tsoracle"
version      = "0.1.11"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description  = "Standalone timestamp oracle server"
publish      = true

[[bin]]
name = "tsoracle"
path = "src/main.rs"

[features]
default    = ["file", "openraft", "paxos"]
file       = ["tsoracle-standalone/file"]
openraft   = ["tsoracle-standalone/openraft"]
paxos      = ["tsoracle-standalone/paxos"]
reflection = ["tsoracle-server/reflection"]
bt         = ["tsoracle-core/bt", "tsoracle-server/bt"]

[dependencies]
anyhow                = "1"
humantime             = "2"
clap                  = { workspace = true }
tokio                 = { workspace = true, features = ["signal"] }
tracing               = { workspace = true }
tracing-subscriber    = { workspace = true }
tonic                 = { workspace = true, features = ["tls-aws-lc"] }
tsoracle-core         = { path = "../tsoracle-core", version = "0.2.3" }
tsoracle-server       = { path = "../tsoracle-server", version = "0.2.6" }
tsoracle-standalone   = { path = "../tsoracle-standalone", version = "0.1.0", default-features = false }

[dev-dependencies]
tsoracle-client    = { path = "../tsoracle-client", version = "0.2.4" }
tsoracle-consensus = { path = "../tsoracle-consensus", version = "0.1.8" }
tsoracle-driver-file = { path = "../tsoracle-driver-file", version = "0.1.8" }
async-trait        = { workspace = true }
futures            = { workspace = true }
parking_lot        = { workspace = true }
rcgen              = { workspace = true }
tokio-stream       = { workspace = true }
tempfile           = { workspace = true }
tokio              = { workspace = true, features = ["process"] }
