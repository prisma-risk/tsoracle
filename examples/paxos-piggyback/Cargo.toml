[package]
name                   = "example-paxos-piggyback"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description            = "tsoracle example: piggyback TSO on a host service's existing OmniPaxos cluster"
publish                = false

[[bin]]
name = "paxos-piggyback"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
tsoracle-core          = { path = "../../crates/tsoracle-core", version = "0.2.1" }
tsoracle-consensus     = { path = "../../crates/tsoracle-consensus", version = "0.1.6" }
tsoracle-server        = { path = "../../crates/tsoracle-server", version = "0.2.3" }
tsoracle-client        = { path = "../../crates/tsoracle-client", version = "0.2.2" }
tsoracle-driver-paxos  = { path = "../../crates/tsoracle-driver-paxos", version = "0.2.2" }
tsoracle-paxos-toolkit = { path = "../../crates/tsoracle-paxos-toolkit", version = "0.2.2", default-features = false, features = ["test-fakes"] }

omnipaxos          = { workspace = true, features = ["serde"] }
async-trait        = { workspace = true }
serde              = { workspace = true }
postcard           = { workspace = true }
tokio              = { workspace = true, features = ["signal"] }
parking_lot        = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
futures            = { workspace = true }
thiserror          = { workspace = true }
