name: release-plz

# Split triggers, each event drives exactly one job (see the `if:` guards below):
#   - workflow_dispatch (manual, Actions tab "Run workflow") fires ONLY the
#     `release-pr` job. This is deliberate: the Release PR is opened/updated on
#     demand instead of on every push, so we don't churn a Release PR on each
#     commit to main. Cut a release by manually dispatching this workflow.
#   - push to main fires ONLY the `release` job. Merging the Release PR is itself
#     a push to main, so the merge still auto-tags + cargo-publishes the bumped
#     crates — publish-on-merge is unchanged.
on:
  # Manual trigger (Actions tab → "Run workflow") — drives `release-pr` only,
  # so the Release PR is opened/updated on demand instead of on every commit.
  workflow_dispatch:
  # Push to main — drives `release` only; a Release PR merge is a push to main,
  # so publish-on-merge still happens automatically. Path-gated to CHANGELOG.md
  # changes: release-plz owns those files (changelog_update = true) and rewrites
  # them on every release, so a Release PR merge always matches while ordinary
  # feature/fix commits don't — the publish job no longer runs on every commit.
  # A stray CHANGELOG edit at most triggers a harmless no-op `release` (it only
  # publishes crates whose version isn't already tagged). Path filters are ignored
  # for workflow_dispatch, so the manual `release-pr` path is unaffected.
  push:
    branches:
      - main
    paths:
      - '**/CHANGELOG.md'

# Tighten default token scope; each job opts in to what it needs.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Publishes (tags + cargo publish + GitHub Release) whenever the release PR
  # has been merged into main. The push trigger is path-gated to CHANGELOG.md
  # changes (see `on:` above), so this no longer fires on ordinary commits; it
  # runs on release PR merges, and harmlessly no-ops on the rare non-release
  # CHANGELOG edit.
  release:
    # Publish only on push to main (i.e. a merged Release PR), never on manual
    # dispatch — `release-pr` owns the manual path.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: release-plz release
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      id-token: write  # for Sigstore gitsign OIDC (signs release tags)
    outputs:
      # JSON array of newly-published packages; consumed by the per-crate
      # attestation jobs below.
      releases: ${{ steps.release-plz.outputs.releases }}
    # Queue serial — never cancel a publish in flight (a half-done publish
    # could leave the repo with some crates released and others not).
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - name: system deps
        timeout-minutes: 5
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9  # v1.6.3
        with:
          packages: protobuf-compiler clang libclang-dev
          version: 1
      # Install Sigstore gitsign so release-plz creates annotated, keyless-signed
      # tags. Signing identity = this workflow's GitHub Actions OIDC token,
      # attested by Fulcio and logged to Rekor (same trust model as the SLSA
      # provenance built by the `prepare-attestation` / `provenance` / `attach`
      # jobs below).
      - name: install gitsign
        env:
          GITSIGN_VERSION: "0.16.0"
          GITSIGN_SHA256: "176b77ae1cf57ac73343c378e2f1338346930324bfb20408b600d97d21e45aa1"
        run: |
          set -euo pipefail
          asset="gitsign_${GITSIGN_VERSION}_linux_amd64"
          curl -sSLo /tmp/gitsign "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/${asset}"
          echo "${GITSIGN_SHA256}  /tmp/gitsign" | sha256sum -c -
          sudo install -m 0755 /tmp/gitsign /usr/local/bin/gitsign
          rm -f /tmp/gitsign
          gitsign --version
      - name: configure git to sign tags via gitsign
        run: |
          set -euo pipefail
          git config --global gpg.x509.program gitsign
          git config --global gpg.format x509
          git config --global tag.gpgSign true
          # Use gitsign's offline Rekor mode: the inclusion proof is embedded
          # in the tag signature itself (keyed to the CMS signed-attributes
          # hash), rather than relying on the Rekor Search API at verify time.
          # gitsign's default ("online") mode reconstructs the signed object
          # with the signature as a `gpgsig` header (commit form) when logging
          # to Rekor, but `git verify-tag` reconstructs annotated tags with the
          # signature in-body (tag form) — the two hashes never match, so
          # `git verify-tag --raw` always fails with "could not find matching
          # tlog entry" for annotated tags. Offline mode is object-type-
          # agnostic and round-trips for tags. (gitsign upstream is migrating
          # its default to offline for this reason.)
          git config --global gitsign.rekorMode offline
      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9  # v0.5
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # When the `release` job above publishes one or more crates, fan out to
  # build per-crate SLSA provenance attestations and attach them (plus the
  # .crate tarball + .sha256 sidecar) to the corresponding GitHub Release.
  # Skipped when no release PR was merged (no crates published in this run).
  #
  # This collapses publishing and signing into one workflow run; the prior
  # standalone release-sign.yml has been removed. Manual workflow_dispatch
  # backfill of pre-existing releases is no longer supported — fix any
  # signing issue forward, not retroactively.
  prepare-attestation:
    name: package and hash released crates
    needs: release
    if: needs.release.outputs.releases != '' && needs.release.outputs.releases != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # JSON array of {crate, version, tag, crate_file, subjects}; consumed
      # via `strategy.matrix.include` by the provenance + attach jobs below.
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - name: system deps
        timeout-minutes: 5
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9  # v1.6.3
        with:
          packages: protobuf-compiler clang libclang-dev
          version: 1
      - name: package each released crate and assemble SLSA matrix
        id: build
        env:
          # Bind release-plz's JSON output to an env var rather than inlining
          # the `${{ }}` expression into the shell body — prevents script
          # injection via crafted package metadata.
          RELEASES_JSON: ${{ needs.release.outputs.releases }}
        run: |
          set -euo pipefail
          # Collect workspace member names once for the crate-exists assertion.
          WS_NAMES="$(cargo metadata --no-deps --format-version 1 \
              | python3 -c 'import sys,json; print(" ".join(p["name"] for p in json.load(sys.stdin)["packages"]))')"
          ITEMS="[]"
          # release-plz's `releases` output is a JSON array of objects with
          # at least .package_name, .version, .tag.
          while IFS= read -r entry; do
            CRATE="$(jq -r '.package_name' <<<"$entry")"
            VERSION="$(jq -r '.version' <<<"$entry")"
            TAG="$(jq -r '.tag // empty' <<<"$entry")"
            # Defensive tag-shape check (mirrors the prior release-sign.yml).
            # A hand-crafted or mis-shaped tag must not silently sign a
            # different crate's tarball.
            if [ -z "$TAG" ] || ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9._-]+-v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
              echo "::error::release-plz entry for '$CRATE' has missing or malformed tag '$TAG'" >&2
              exit 1
            fi
            if ! printf ' %s ' "$WS_NAMES" | grep -q " $CRATE "; then
              echo "::error::release-plz reports '$CRATE' was released, but it is not a workspace member at this commit" >&2
              exit 1
            fi
            CRATE_FILE="${CRATE}-${VERSION}.crate"
            cargo package --no-verify --locked -p "$CRATE"
            CRATE_PATH="target/package/$CRATE_FILE"
            if [ ! -f "$CRATE_PATH" ]; then
              echo "::error::expected packaged crate at $CRATE_PATH, not found" >&2
              ls -la target/package/ >&2 || true
              exit 1
            fi
            SHA256="$(sha256sum "$CRATE_PATH" | awk '{print $1}')"
            # SLSA generic generator v2.x expects base64-subjects to be the
            # SHA256SUMS line(s) (`<sha256>  <name>` — two spaces between),
            # NOT a JSON array. Identical content goes into the .sha256 sidecar.
            SHA256SUMS_LINE="$(printf '%s  %s' "$SHA256" "$CRATE_FILE")"
            SUBJECTS_B64="$(printf '%s' "$SHA256SUMS_LINE" | base64 -w0)"
            printf '%s\n' "$SHA256SUMS_LINE" > "${CRATE_PATH}.sha256"
            ITEMS="$(jq -c --arg c "$CRATE" --arg v "$VERSION" --arg t "$TAG" \
                --arg cf "$CRATE_FILE" --arg s "$SUBJECTS_B64" \
                '. + [{crate:$c, version:$v, tag:$t, crate_file:$cf, subjects:$s}]' <<<"$ITEMS")"
          done < <(jq -c '.[]' <<<"$RELEASES_JSON")
          echo "matrix=$ITEMS" >> "$GITHUB_OUTPUT"
      - name: upload packaged crates for the attach job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: packaged-crates
          path: |
            target/package/*.crate
            target/package/*.crate.sha256
          if-no-files-found: error
          retention-days: 7

  # One reusable-workflow invocation per published crate. The generator signs
  # the SHA256 subject against Sigstore (Fulcio + Rekor) and emits the
  # .intoto.jsonl as a workflow artifact named exactly its `provenance-name`.
  #
  # SLSA generator does NOT support SHA pins (its generate-builder.sh
  # rejects refs that don't match refs/tags/vX.Y.Z, exit 2). Tag ref is
  # intentional and matches what scorecard's own goreleaser.yaml does.
  # Full rationale: SECURITY.md "Documented exception" section. Bump
  # this tag intentionally; do not SHA-pin.
  provenance:
    needs: prepare-attestation
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-attestation.outputs.matrix) }}
    permissions:
      actions: read       # generator inspects the workflow to record build metadata
      contents: write     # parse-time satisfaction for the generator's upload-assets
                          # nested job. Gated off with `upload-assets: false` (default)
                          # so the PATCH against the immutable release never happens —
                          # but Actions validates declared permissions of every nested
                          # job at parse time regardless of `if:`, so `contents: read`
                          # is rejected at workflow load.
      id-token: write     # OIDC token for Sigstore (Fulcio) keyless signing
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ matrix.subjects }}
      provenance-name: ${{ matrix.crate_file }}.intoto.jsonl

  # Attach .crate + .sha256 + .intoto.jsonl to each crate's GitHub Release.
  # Only asset slots are touched — release metadata is left untouched, so
  # this is safe against immutable releases.
  attach:
    name: attach .crate + provenance to release
    needs: [prepare-attestation, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-attestation.outputs.matrix) }}
    steps:
      - name: Download packaged crates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: packaged-crates
          path: artifacts
      - name: Download SLSA provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          # The SLSA generator uploads its artifact named exactly its
          # `provenance-name` input, so we pass the same value here.
          name: ${{ matrix.crate_file }}.intoto.jsonl
          path: artifacts
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          CRATE_FILE: ${{ matrix.crate_file }}
          PROVENANCE_FILE: ${{ matrix.crate_file }}.intoto.jsonl
        run: |
          set -euo pipefail
          # --clobber: idempotent on re-run (e.g. CI rerun). gh does not retry
          # internally; a transient failure is safe to re-run.
          gh release upload "$TAG" \
            "artifacts/$CRATE_FILE" \
            "artifacts/${CRATE_FILE}.sha256" \
            "artifacts/$PROVENANCE_FILE" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  # Opens or updates the release PR. The PR contains the version bumps +
  # CHANGELOG diffs; merging it triggers the `release` job above on the next
  # push. Manual only: runs on workflow_dispatch so the Release PR is cut on
  # demand rather than on every push to main.
  release-pr:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - name: system deps
        timeout-minutes: 5
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9  # v1.6.3
        with:
          packages: protobuf-compiler clang libclang-dev
          version: 1
      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9  # v0.5
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # `fuzz/` is its own cargo workspace (cargo-fuzz convention) and
      # path-depends on workspace crates. When release-plz bumps a workspace
      # crate's `[package].version`, fuzz/Cargo.lock keeps the pre-bump pin
      # and the CI `fuzz lockfile` guard (ci.yml) fails on the release PR.
      # Resync the lock on top of the release branch so the PR ships green.
      - name: sync fuzz/Cargo.lock onto release PR
        env:
          RELEASE_PRS: ${{ steps.release-plz.outputs.prs }}
          GIT_AUTHOR_NAME: release-plz[bot]
          GIT_AUTHOR_EMAIL: release-plz[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: release-plz[bot]
          GIT_COMMITTER_EMAIL: release-plz[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_PRS:-}" ] || [ "${RELEASE_PRS}" = "[]" ]; then
            echo "release-plz did not open/update a PR; nothing to sync."
            exit 0
          fi
          branch="$(jq -r '.[0].head_branch // empty' <<<"$RELEASE_PRS")"
          if [ -z "$branch" ]; then
            echo "release-plz outputs did not include a head_branch; nothing to sync."
            exit 0
          fi
          git fetch origin "$branch"
          git checkout "$branch"
          (cd fuzz && cargo update --workspace)
          if git diff --quiet -- fuzz/Cargo.lock; then
            echo "fuzz/Cargo.lock already in sync."
            exit 0
          fi
          git commit -m 'chore(fuzz): resync fuzz/Cargo.lock with workspace bumps' -- fuzz/Cargo.lock
          git push origin "$branch"
