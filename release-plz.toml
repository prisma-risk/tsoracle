# release-plz configuration — https://release-plz.ieni.dev/docs
#
# How releases work:
#   1. Land commits on `main` using conventional commit prefixes (feat:, fix:,
#      chore:, refactor:, docs:, etc.). The prefix determines the version bump.
#   2. The `release-plz PR` job opens (or updates) a "Release PR" that bumps
#      `[workspace.package].version` and writes per-crate CHANGELOG.md entries.
#   3. Reviewing+merging that PR triggers the `release-plz release` job, which
#      tags the release and runs `cargo publish` in topological order for every
#      workspace member that does NOT have `publish = false`.

[workspace]
# Don't run `cargo update` during release; keep Cargo.lock churn scoped to PRs
# that intentionally bump deps.
dependencies_update = false

# Create a GitHub Release for every published crate version.
git_release_enable = true

# Tag releases (one tag per crate, e.g. `tsoracle-core-v0.2.0`).
git_tag_enable = true

# Maintain CHANGELOG.md per crate from conventional commit messages.
changelog_update = true

# Run `cargo publish --verify` before uploading — catches breakage that only
# shows up against the packaged tarball (e.g. files missing from `include`).
publish_no_verify = false

# Off for now; flip to `true` (and `cargo install cargo-semver-checks`) once we
# want automated semver-compat guarding on the release PR.
semver_check = false

# tsoracle (the bin) was published to crates.io as 0.1.0 from a commit whose
# workspace `Cargo.toml` listed `examples/embedded-server` (et al.) as members
# before those directories existed in the tree. `cargo package` fails at that
# historical commit, which means release-plz cannot run its file-equality
# comparison against the published version — and that error aborts the entire
# release-pr step for the whole workspace, not just this one crate.
#
# Excluding the bin from release-plz management lets the other crates ride the
# release-pr / release pipeline normally. To re-enable: manually
# `cargo publish` a new `tsoracle` version from a commit where the workspace
# `cargo metadata` succeeds (i.e. anything on or after the commit that added
# the `examples/` directories), then drop this `[[package]]` block.
[[package]]
name = "tsoracle"
release = false
