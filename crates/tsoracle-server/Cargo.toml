[package]
name         = "tsoracle-server"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme.workspace       = true
description  = "Embeddable gRPC server for the timestamp oracle."
documentation = "https://docs.rs/tsoracle-server"
keywords      = ["tsoracle", "grpc", "server", "timestamp", "oracle"]
categories    = ["network-programming", "database"]

[features]
default    = ["tls-rustls", "tracing"]
tls-rustls = ["tonic/tls-aws-lc"]
tls-native = ["tonic/tls-native-roots"]
tracing    = ["dep:tracing"]
test-fakes = []
reflection = ["dep:tonic-reflection", "tsoracle-proto/reflection"]

[package.metadata.docs.rs]
features       = ["tls-rustls", "tracing", "reflection"]
rustdoc-args   = ["--cfg", "docsrs"]

[dependencies]
async-trait        = { workspace = true }
futures            = { workspace = true }
parking_lot        = { workspace = true }
prost              = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true }
tokio-stream       = { workspace = true }
tonic              = { workspace = true }
tonic-prost        = { workspace = true }
tonic-reflection   = { workspace = true, optional = true }
tracing            = { workspace = true, optional = true }
tsoracle-core      = { path = "../tsoracle-core", version = "0.1.0" }
tsoracle-consensus = { path = "../tsoracle-consensus", version = "0.1.0" }
tsoracle-proto     = { path = "../tsoracle-proto", version = "0.1.0" }

[dev-dependencies]
tokio          = { workspace = true, features = ["test-util"] }
tsoracle-core   = { path = "../tsoracle-core", version = "0.1.0", features = ["test-clock"] }
tsoracle-client = { path = "../tsoracle-client", version = "0.1.0" }

[[test]]
name = "e2e"
required-features = ["test-fakes"]

[[test]]
name = "leader_watch"
required-features = ["test-fakes"]

[[test]]
name = "embedded_router"
required-features = ["test-fakes"]

[[test]]
name = "extension_stampede"
required-features = ["test-fakes"]

[[test]]
name = "leadership_churn"
required-features = ["test-fakes"]

[[test]]
name = "serve_with_listener"
required-features = ["test-fakes"]
