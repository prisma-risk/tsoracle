name: fuzz (nightly)

on:
  schedule:
    # 02:00 UTC daily -- off-peak for both US and EU dev mornings.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: "Fuzz target name (or 'all' to run the full matrix)."
        required: false
        default: all
        type: string
      duration:
        description: "Per-target budget in seconds (default 1800 = 30 minutes)."
        required: false
        default: "1800"
        type: string

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    # Hard ceiling above the 30-minute budget, leaving margin for setup,
    # cache restore, and artifact upload.
    timeout-minutes: 60
    permissions:
      issues: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - record_decode
          - record_roundtrip
          - proto_get_ts_request_decode
          - proto_get_ts_response_decode
          - proto_leader_hint_decode
          - log_entry_decode
          - snapshot_payload_decode
          - toolkit_codec_decode
    steps:
      - uses: actions/checkout@v6

      - name: Skip non-matching target (manual dispatch)
        # When dispatched manually with a specific target, all other matrix
        # legs become no-ops. Cheaper than disabling the matrix.
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.target != 'all' &&
          github.event.inputs.target != matrix.target
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          REQUESTED_TARGET: ${{ github.event.inputs.target }}
        run: |
          echo "Skipping $MATRIX_TARGET (workflow_dispatch requested $REQUESTED_TARGET)"
          exit 0

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-31
          components: rust-src, llvm-tools-preview

      - name: Install protoc
        timeout-minutes: 5
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05  # v1.6.0
        with:
          packages: protobuf-compiler
          version: 1

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.1

      - name: Restore working corpus
        uses: actions/cache/restore@v5
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ hashFiles('fuzz/Cargo.lock', format('fuzz/fuzz_targets/{0}.rs', matrix.target)) }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-${{ hashFiles('fuzz/Cargo.lock', format('fuzz/fuzz_targets/{0}.rs', matrix.target)) }}-
            fuzz-corpus-${{ matrix.target }}-

      - name: Determine budget
        id: budget
        env:
          REQUESTED_DURATION: ${{ github.event.inputs.duration }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "seconds=${REQUESTED_DURATION}" >> "$GITHUB_OUTPUT"
          else
            echo "seconds=1800" >> "$GITHUB_OUTPUT"
          fi

      - name: Run fuzz target
        id: fuzz
        working-directory: fuzz
        # --target x86_64-unknown-linux-gnu overrides cargo-fuzz 0.13's
        # default of x86_64-unknown-linux-musl on Linux. The musl default
        # links libc statically, which is incompatible with ASAN. See the
        # matching comment in fuzz-pr.yml for the full explanation.
        env:
          TARGET: ${{ matrix.target }}
          BUDGET: ${{ steps.budget.outputs.seconds }}
        run: |
          set +e
          cargo fuzz run "$TARGET" \
            --sanitizer address \
            --target x86_64-unknown-linux-gnu \
            -- -max_total_time="$BUDGET" \
            2>&1 | tee fuzz-output.log
          EXIT=${PIPESTATUS[0]}
          echo "exit_code=${EXIT}" >> "$GITHUB_OUTPUT"
          exit $EXIT

      - name: Upload crash artifact
        if: failure() && steps.fuzz.outputs.exit_code != '0'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 30
          if-no-files-found: warn

      - name: Auto-file deduplicated issue
        # Schedule and workflow_dispatch always run with full GITHUB_TOKEN
        # permissions in the base repo's context -- no fork-PR gate needed
        # here (unlike fuzz-pr.yml).
        if: failure() && steps.fuzz.outputs.exit_code != '0'
        uses: ./.github/actions/fuzz-auto-issue
        with:
          target: ${{ matrix.target }}
          libfuzzer-output: fuzz/fuzz-output.log
          artifact-name: fuzz-crash-${{ matrix.target }}-${{ github.run_id }}
          run-id: ${{ github.run_id }}

      - name: Save working corpus (even on failure)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ hashFiles('fuzz/Cargo.lock', format('fuzz/fuzz_targets/{0}.rs', matrix.target)) }}-${{ github.run_id }}
