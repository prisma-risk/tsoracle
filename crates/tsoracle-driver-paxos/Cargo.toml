[package]
name         = "tsoracle-driver-paxos"
description  = "OmniPaxos-backed ConsensusDriver for tsoracle"
version      = "0.2.2"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[features]
default          = ["rocksdb-storage"]
rocksdb-storage  = ["tsoracle-paxos-toolkit/rocksdb-storage"]
yieldpoints      = ["tsoracle-yieldpoint/yieldpoints"]
metrics          = ["dep:metrics", "tsoracle-paxos-toolkit/metrics"]

[dependencies]
async-trait          = { workspace = true }
futures              = { workspace = true }
metrics              = { workspace = true, optional = true }
omnipaxos            = { workspace = true, features = ["serde"] }
parking_lot          = { workspace = true }
postcard             = { workspace = true }
serde                = { workspace = true }
thiserror            = { workspace = true }
tokio                = { workspace = true }
tokio-stream         = { workspace = true }
tracing              = { workspace = true }
tsoracle-consensus   = { path = "../tsoracle-consensus", version = "0.1.6", features = ["serde"] }
tsoracle-core        = { path = "../tsoracle-core", version = "0.2.1" }
tsoracle-paxos-toolkit = { path = "../tsoracle-paxos-toolkit", version = "0.2.2", default-features = false }
tsoracle-yieldpoint  = { workspace = true }

[dev-dependencies]
anyhow           = { workspace = true }
metrics-util     = { workspace = true }
proptest         = { workspace = true }
rocksdb          = { workspace = true }
tempfile         = { workspace = true }
tokio            = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tsoracle-paxos-toolkit = { path = "../tsoracle-paxos-toolkit", version = "0.2.2", features = ["rocksdb-storage", "test-fakes"] }
