{% set data = load_data(path="content/diagrams/" ~ name ~ ".json") %}
{% set caption = title | default(value='') %}
<figure class="diagram" data-d3-init="window-timeline">
    <svg viewBox="0 0 800 220" role="img" aria-label="{{ caption | default(value='Window timeline: ' ~ name) }}" preserveAspectRatio="xMidYMid meet">
        <text x="400" y="110" text-anchor="middle" fill="#8A8A86" font-family="JetBrainsMono, ui-monospace, monospace" font-size="14">
            {% for w in data.windows %}{{ w.label }} [{{ w.start }}-{{ w.end }}]{% if not loop.last %} · {% endif %}{% endfor %}
        </text>
    </svg>
    <script type="application/json">{{ data | json_encode | safe }}</script>
    {% if caption %}<figcaption>{{ caption }}</figcaption>{% endif %}
</figure>
