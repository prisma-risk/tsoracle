name: Pages build check

on:
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/og-image/**'
      - '.github/workflows/pages-build-check.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and og-image build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scripts/og-image/target
          key: og-image-${{ runner.os }}-${{ hashFiles('scripts/og-image/Cargo.toml', 'scripts/og-image/src/main.rs') }}

      - name: Generate og:image PNGs
        run: cargo run --release --manifest-path scripts/og-image/Cargo.toml

      - name: Install Zola
        run: |
          ZOLA_VERSION="0.22.1"
          curl -fsSL -o zola.tar.gz \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf zola.tar.gz
          sudo mv zola /usr/local/bin/zola
          zola --version

      - name: Build site
        working-directory: site
        run: zola build

      - name: Check links
        working-directory: site
        run: zola check --skip-external-links
