[package]
name         = "tsoracle-core"
description  = "Sync algorithm core for tsoracle: window allocator, 46/18-bit timestamp packing, monotonicity invariants, and the shared cluster peer type."
version      = "0.2.3"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme.workspace       = true
documentation = "https://docs.rs/tsoracle-core"
keywords      = ["timestamp", "oracle", "tso", "hlc", "algorithm"]
categories    = ["algorithms", "date-and-time", "concurrency"]

[features]
default    = ["std"]
std        = []
serde      = ["dep:serde"]
test-clock = []
# Capture a `std::backtrace::Backtrace` in instrumented error variants. With
# this off, `Bt` is a ZST and `Bt::capture()` is a no-op. With it on, capture
# is still gated at runtime by `RUST_BACKTRACE`/`RUST_LIB_BACKTRACE`.
bt = ["std"]

[package.metadata.docs.rs]
features       = ["std", "serde"]
rustdoc-args   = ["--cfg", "docsrs"]

[dependencies]
thiserror = { workspace = true }
serde     = { workspace = true, optional = true }

[dev-dependencies]
husky-rs = { workspace = true }
proptest = { workspace = true }
