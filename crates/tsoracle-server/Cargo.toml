[package]
name         = "tsoracle-server"
version      = "3.0.1"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme                 = "README.md"
description  = "Embeddable gRPC server for the timestamp oracle."
documentation = "https://docs.rs/tsoracle-server"
keywords      = ["tsoracle", "grpc", "server", "timestamp", "oracle"]
categories    = ["network-programming", "database"]

[features]
default    = ["tls-rustls", "tracing"]
failpoints = ["tsoracle-failpoint/failpoints"]
yieldpoints = ["tsoracle-yieldpoint/yieldpoints"]
metrics    = ["dep:metrics"]
tls-rustls = ["tonic/tls-aws-lc"]
tls-native = ["tonic/tls-native-roots"]
tracing    = ["dep:tracing"]
test-fakes = []
test-support = ["test-fakes"]
reflection = ["dep:tonic-reflection", "tsoracle-proto/reflection"]
# Capture a `std::backtrace::Backtrace` in instrumented error variants. With
# this off, `Bt` is a ZST and `Bt::capture()` is a no-op. With it on, capture
# is still gated at runtime by `RUST_BACKTRACE`/`RUST_LIB_BACKTRACE`.
bt         = []

[package.metadata.docs.rs]
features       = ["tls-rustls", "tracing", "reflection", "metrics"]
rustdoc-args   = ["--cfg", "docsrs"]

[dependencies]
async-trait        = { workspace = true }
futures            = { workspace = true }
metrics            = { workspace = true, optional = true }
parking_lot        = { workspace = true }
prost              = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true, features = ["signal"] }
tokio-stream       = { workspace = true }
tonic              = { workspace = true }
tonic-prost        = { workspace = true }
tonic-reflection   = { workspace = true, optional = true }
tracing            = { workspace = true, optional = true }
tsoracle-core      = { path = "../tsoracle-core", version = "2.1.1" }
tsoracle-consensus = { path = "../tsoracle-consensus", version = "2.0.1" }
tsoracle-proto     = { path = "../tsoracle-proto", version = "1.1.0" }
tsoracle-yieldpoint = { workspace = true }
tsoracle-failpoint = { workspace = true }

[dev-dependencies]
tokio        = { workspace = true, features = ["test-util"] }
metrics-util = { workspace = true }
tsoracle-core = { path = "../tsoracle-core", version = "2.1.1" }
tsoracle-driver-file = { path = "../tsoracle-driver-file" }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true }

[[test]]
name = "e2e"
required-features = ["test-support"]

[[test]]
name = "get_current_max_safe"
required-features = ["test-support"]

[[test]]
name = "leader_watch"
required-features = ["test-fakes"]

[[test]]
name = "embedded_router"
required-features = ["test-support"]

[[test]]
name = "leadership_churn"
required-features = ["test-support"]

[[test]]
name = "serve_shutdown"
required-features = ["test-fakes"]

[[test]]
name = "metrics"
required-features = ["test-support", "metrics"]

[[test]]
name = "fence_yieldpoint"
required-features = ["yieldpoints", "test-fakes"]

[[test]]
name = "heartbeat_into_router"
required-features = ["test-support", "tracing"]

[[test]]
name = "get_seq"
required-features = ["test-support"]
