[package]
name = "bench-minimal"
description = "tsoracle overhead benchmark: end-to-end through tonic, in-memory ConsensusDriver. Not a published crate."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme.workspace       = true
publish = false

[features]
default      = []
tokio-console = ["dep:console-subscriber"]
flamegraph   = ["dep:tracing-flame"]

[dependencies]
anyhow             = { workspace = true }
clap               = { workspace = true, features = ["derive"] }
hdrhistogram       = { workspace = true }
humantime          = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tonic              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

tsoracle-server    = { path = "../../crates/tsoracle-server", version = "3.2.1", features = ["test-fakes"] }
tsoracle-client    = { path = "../../crates/tsoracle-client", version = "1.3.0" }
tsoracle-core      = { path = "../../crates/tsoracle-core", version = "2.3.0" }
tsoracle-consensus = { path = "../../crates/tsoracle-consensus", version = "2.2.0" }

console-subscriber = { version = "0.5", optional = true }
tracing-flame      = { version = "0.2", optional = true }

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
