repository.workspace   = true
description            = "tsoracle example: TLS and mTLS configuration end-to-end (client + server, in-memory certs)"
publish                = false

[dependencies]
tsoracle-server      = { path = "../../crates/tsoracle-server", version = "3.1.0" }
