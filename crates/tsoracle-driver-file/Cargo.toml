[package]
name         = "tsoracle-driver-file"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme.workspace       = true
description  = "Single-node fsync-durable file driver (ConsensusDriver impl) for tsoracle."
documentation = "https://docs.rs/tsoracle-driver-file"
keywords      = ["tsoracle", "wal", "storage", "fsync", "driver"]
categories    = ["database-implementations", "filesystem"]

[features]
default    = []
failpoints = ["dep:fail", "fail/failpoints"]
bt         = ["tsoracle-core/bt", "tsoracle-consensus/bt"]

[package.metadata.docs.rs]
all-features = false
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
async-trait        = { workspace = true }
fail               = { workspace = true, optional = true }
crc32c             = { workspace = true }
fs2                = "0.4"
futures            = { workspace = true }
libc               = "0.2"
parking_lot        = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true }
tokio-stream       = { workspace = true }
tsoracle-core      = { path = "../tsoracle-core", version = "0.1.1" }
tsoracle-consensus = { path = "../tsoracle-consensus", version = "0.1.1" }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["test-util"] }

[[test]]
name              = "failpoints"
path              = "tests/failpoints.rs"
required-features = ["failpoints"]
