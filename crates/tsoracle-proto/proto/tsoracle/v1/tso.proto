syntax = "proto3";
package tsoracle.v1;

// Public timestamp-oracle service.
//
// Clients call `GetTs` to allocate one or more consecutive timestamps. The
// service guarantees that successive successful grants are strictly
// monotonically increasing (within and across calls) for the lifetime of a
// leader epoch, and that no two grants from any epoch ever overlap.
service TsoService {
  // Allocate `count` consecutive timestamps.
  //
  // On success the response covers logicals
  // [logical_start, logical_start + count - 1] at the returned `physical_ms`,
  // stamped with the leader's `epoch_hi`/`epoch_lo`.
  //
  // Only the current leader serves this RPC. A non-leader returns
  // `FAILED_PRECONDITION` with a `tsoracle-leader-hint-bin` binary metadata
  // trailer carrying a postcard-encoded `LeaderHint` (see below); clients
  // re-route to the hinted leader and retry.
  rpc GetTs(GetTsRequest) returns (GetTsResponse);

  // Read the current safe-point. Safe-point is the highest physical-millisecond
  // at which any timestamp issued at or before that physical_ms is durably
  // backed by the leader's persisted window. External coordinators poll this
  // RPC to fence reads/writes that depend on a durable timestamp watermark.
  //
  // - Leaders return the authoritative current value.
  // - Followers return 0; target the leader for an authoritative value.
  // - A response of zero also means the leader has not yet admitted a window
  //   (cold start before the first persist).
  rpc GetCurrentMaxSafe(GetCurrentMaxSafeRequest) returns (GetCurrentMaxSafeResponse);

  // Allocate a contiguous block of `count` dense ordinals for `key`.
  //
  // Returns [start, start + count) — a gapless consecutive range guaranteed
  // not to overlap with any other grant for the same key. `start` is the
  // durably-committed pre-advance counter value; ordinals are never reused
  // even across leader transitions or restarts.
  //
  // Only the current leader serves this RPC; a non-leader returns
  // `FAILED_PRECONDITION` with the same `tsoracle-leader-hint-bin` trailer
  // as `GetTs`. This RPC is non-idempotent: a committed advance that is not
  // delivered to the client is a spent (but non-duplicate) ordinal block —
  // clients must treat an ambiguous failure as `SeqUncertain` and not retry.
  rpc GetSeq(GetSeqRequest) returns (GetSeqResponse);

  // Atomically allocate contiguous dense blocks for several DISTINCT keys in
  // one call. All-or-nothing: either every key advances or none does. The
  // response lists one grant per request entry, in request order, plus the
  // single leader epoch that issued the batch. Same leadership routing and
  // `tsoracle-leader-hint-bin` trailer as `GetSeq`. Like `GetSeq` this is
  // non-idempotent: an ambiguous failure means the whole batch may or may not
  // have committed — clients treat it as `SeqUncertain` and must not retry.
  rpc GetSeqBatch(GetSeqBatchRequest) returns (GetSeqBatchResponse);

  // Acquire (or idempotently re-acquire) a stamping lease for an opaque
  // holder group. The returned `ts_upper_bound` is the highest physical_ms
  // the holder may stamp; it is allocated through the same durable
  // high-water discipline as GetTs window extension, and the lease record
  // is durably persisted before this RPC returns, so leases survive
  // failover. A request whose `holder` matches an active lease at a
  // strictly higher `holder_epoch` atomically supersedes the old lease
  // (its bound stops advancing; it still counts toward the safe frontier
  // until it expires). Same-epoch re-acquire returns the live lease
  // unchanged; a lower epoch is rejected with FAILED_PRECONDITION.
  //
  // Leader-only, like GetTs: a non-leader returns FAILED_PRECONDITION with
  // the `tsoracle-leader-hint-bin` trailer.
  rpc AcquireLease(AcquireLeaseRequest) returns (AcquireLeaseResponse);

  // Advance a live lease's bound and expiry, re-arming its acquire-time TTL.
  // Rejected with NOT_FOUND for an unknown lease_id and with
  // FAILED_PRECONDITION for an expired or superseded lease. Leader-only,
  // with the same routing as AcquireLease.
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);

  // Gracefully surrender a lease: it immediately stops counting toward the
  // safe frontier. Idempotent — releasing an unknown, expired, or already
  // released lease succeeds. Leader-only, same routing as AcquireLease.
  rpc ReleaseLease(ReleaseLeaseRequest) returns (ReleaseLeaseResponse);

  // Read the safe frontier: min over every unexpired lease's ts_upper_bound
  // (active or superseded) and the issued-but-unleased high-water (the
  // allocator's committed high-water). Generalizes GetCurrentMaxSafe; same
  // follower behavior — followers return 0 with a zero epoch, and the leader
  // answers authoritatively.
  rpc GetSafeFrontier(GetSafeFrontierRequest) returns (GetSafeFrontierResponse);
}

message GetTsRequest {
  // Number of consecutive timestamps to allocate. Must be >= 1.
  uint32 count = 1;
}

message GetCurrentMaxSafeRequest {}

message GetCurrentMaxSafeResponse {
  // Safe-point in physical-millisecond units (not the 64-bit packed form).
  // Equal to `persisted_high_water - window_ahead_ms - 1` on the leader when
  // a window has been admitted; zero otherwise (cold start or non-leader).
  uint64 max_safe_physical_ms = 1;
  // Leader epoch attached so long-lived pollers can fence stale-leader values,
  // split into two 64-bit halves matching `GetTsResponse.epoch_hi`/`epoch_lo`.
  uint64 epoch_hi = 2;
  uint64 epoch_lo = 3;
}

message GetTsResponse {
  // 46-bit milliseconds-since-Unix-epoch component.
  uint64 physical_ms = 1;
  // 18-bit logical counter; the response covers logicals
  // [logical_start, logical_start + count - 1] at this physical_ms.
  uint32 logical_start = 2;
  // Number of consecutive timestamps allocated. Equals the request's `count`
  // on success (the server never returns a partial grant).
  uint32 count = 3;
  // Leader epoch that issued this grant, as a 128-bit value split into two
  // 64-bit halves (epoch_hi is the more significant half). Lexicographic
  // (epoch_hi, epoch_lo) order equals numeric order. Strictly monotone per
  // node across leader terms; clients use it to detect a leader handoff
  // (a smaller epoch after a larger one indicates a stale server).
  uint64 epoch_hi = 4;
  uint64 epoch_lo = 5;
}

message GetSeqRequest {
  string key = 1; // bounded UTF-8 sequence key
  uint32 count = 2; // must be >= 1
}

message GetSeqResponse {
  string key = 1;
  uint64 start = 2; // first ordinal of the contiguous block [start, start+count)
  uint32 count = 3;
  // Leader epoch that issued this block, as a single nested message so its
  // presence implies both halves — bundling makes a half-populated (corrupt)
  // epoch unrepresentable on the wire, matching `LeaderHint.leader_epoch`.
  // Always populated on a successful response; the client seats its confirmed
  // leader cache from it (a missing epoch on success is a protocol violation).
  EpochWire epoch = 4;
}

message SeqRequestEntry {
  string key = 1; // bounded UTF-8 sequence key
  uint32 count = 2; // must be >= 1
}

message GetSeqBatchRequest {
  // 1..=max_seq_batch_keys entries; keys must be distinct (a duplicate is
  // rejected with INVALID_ARGUMENT).
  repeated SeqRequestEntry entries = 1;
}

message SeqGrantEntry {
  string key = 1;
  uint64 start = 2; // block is [start, start+count)
  uint32 count = 3;
}

message GetSeqBatchResponse {
  // One grant per request entry, in the SAME order as the request.
  repeated SeqGrantEntry grants = 1;
  // The single leader epoch that committed the whole batch (one atomic apply,
  // one epoch). Always populated on success; bundled so a half-populated epoch
  // is unrepresentable, matching GetSeqResponse.epoch.
  EpochWire epoch = 2;
}

// Carried in the `tsoracle-leader-hint-bin` binary metadata trailer when the
// server returns FAILED_PRECONDITION from GetTs because it is not currently
// the leader. The body is postcard-encoded; the client filters this trailer
// out before exposing the gRPC `Status` to user code.
message LeaderHint {
  // Scheme-less `host:port` of the leader's TsoService endpoint as known to
  // this node. Absent when the node has no leader information yet (cold start,
  // or right after a leadership change). The client treats the hint as
  // advisory: a stale hint costs an extra round trip, not correctness.
  optional string leader_endpoint = 1;
  // Leader epoch as a single nested message, so its presence implies both
  // halves: the hint either carries a complete epoch or none. Bundling the
  // halves makes a half-populated (corrupt) epoch unrepresentable on the
  // wire and in the generated Rust types.
  optional EpochWire leader_epoch = 2;
}

// The 128-bit leader epoch split into two 64-bit halves (`hi` is the more
// significant half), matching `GetTsResponse.epoch_hi`/`epoch_lo`.
// Lexicographic (hi, lo) order equals numeric order.
message EpochWire {
  uint64 hi = 1;
  uint64 lo = 2;
}

message AcquireLeaseRequest {
  // Opaque holder-group key, 1..=128 bytes. tsoracle compares it only for
  // byte equality.
  bytes holder = 1;
  // Supersede ordering within the holder group. Strictly higher supersedes;
  // equal is idempotent; lower rejects.
  uint64 holder_epoch = 2;
  // Requested TTL in milliseconds. Server-enforced floor/ceiling default to
  // 5s / 300s; out-of-bounds requests fail INVALID_ARGUMENT.
  uint64 ttl_ms = 3;
}

message AcquireLeaseResponse {
  // Stable lease identity for RenewLease/ReleaseLease.
  uint64 lease_id = 1;
  // Highest physical-millisecond the holder may stamp.
  uint64 ts_upper_bound = 2;
  // Server-clock expiry in milliseconds since Unix epoch.
  uint64 expires_at_ms = 3;
  // tsoracle leader epoch that granted the lease; bundled so a
  // half-populated epoch is unrepresentable, matching GetSeqResponse.epoch.
  EpochWire epoch = 4;
}

message RenewLeaseRequest {
  uint64 lease_id = 1;
}

message RenewLeaseResponse {
  uint64 ts_upper_bound = 1;
  uint64 expires_at_ms = 2;
  EpochWire epoch = 3;
}

message ReleaseLeaseRequest {
  uint64 lease_id = 1;
}

message ReleaseLeaseResponse {}

message GetSafeFrontierRequest {}

message GetSafeFrontierResponse {
  // The safe frontier in physical-millisecond units; zero on a follower or
  // a leader that has not yet admitted a window.
  uint64 frontier_physical_ms = 1;
  // Leader epoch, split like GetCurrentMaxSafeResponse.epoch_hi/epoch_lo.
  uint64 epoch_hi = 2;
  uint64 epoch_lo = 3;
}
