[package]
name         = "tsoracle-tests"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish      = false
description  = "Private integration-test crate. Hosts the end-to-end tests that exercise tsoracle-client against tsoracle-server (and vice versa) so neither lib needs a dev-dep on the other — releasing one no longer requires the other to already be on crates.io."

[features]
default    = ["tls-rustls"]
tls-rustls = ["tsoracle-server/tls-rustls", "tsoracle-client/tls-rustls"]
tls-native = ["tsoracle-server/tls-native", "tsoracle-client/tls-native"]
# Mirror tsoracle-server's `failpoints` feature so the failpoint-driven
# integration tests can be opted in. `cargo test -p tsoracle-tests --features failpoints`.
failpoints = ["tsoracle-server/failpoints", "dep:fail"]
# Opt-in mirror of `tsoracle-client`'s `metrics` feature so `client_metrics`
# can drive the recorder-fake test that asserts the documented client signals.
metrics = ["tsoracle-client/metrics", "dep:metrics", "dep:metrics-util", "dep:tokio-stream"]
dst = ["dep:turmoil", "tsoracle-server/dst"]

[dependencies]
fail            = { workspace = true, optional = true }
futures         = { workspace = true }
metrics         = { workspace = true, optional = true }
metrics-util    = { workspace = true, optional = true }
rcgen           = { workspace = true }
tokio           = { workspace = true, features = ["test-util"] }
tokio-stream    = { workspace = true, optional = true, features = ["net"] }
tonic           = { workspace = true }
turmoil         = { version = "0.7", optional = true }
tsoracle-client = { path = "../tsoracle-client" }
tsoracle-core   = { path = "../tsoracle-core" }
tsoracle-proto  = { path = "../tsoracle-proto" }
tsoracle-server = { path = "../tsoracle-server", features = ["test-support"] }

[[test]]
name = "client_e2e"

[[test]]
name = "client_backpressure"

[[test]]
name = "client_freshness"

[[test]]
name              = "server_failpoints"
required-features = ["failpoints"]

[[test]]
name = "server_serve_with_listener"

[[test]]
name = "client_tls"

[[test]]
name              = "client_metrics"
required-features = ["metrics"]

[[test]]
name              = "dst_window_race"
required-features = ["dst"]
