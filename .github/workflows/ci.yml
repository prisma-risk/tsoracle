name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The workspace's debug+test binaries for the openraft + rocksdb crates
      # have grown past the ubuntu-latest runner's free disk budget — the
      # final link step in `cargo test --workspace --all-features` hits
      # ENOSPC inside `ld`. Stripping the pre-installed Android SDK / .NET /
      # Haskell toolchains frees ~30 GB before any cargo work begins; the
      # Rust toolchain installed below lives in ~/.cargo and is not touched
      # by `tool-cache: false`.
      - name: free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang libclang-dev
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: build
        run: cargo build --workspace --all-features --locked
      - name: test
        run: cargo test --workspace --all-features --locked

  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99  # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: buf lint
        run: buf lint crates/tsoracle-proto/proto
      - name: buf format
        run: buf format --diff --exit-code crates/tsoracle-proto/proto
      - name: buf breaking
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/heads/${BASE_REF}"
          buf breaking crates/tsoracle-proto/proto \
            --against ".git#branch=${BASE_REF},subdir=crates/tsoracle-proto/proto"

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: EmbarkStudios/cargo-deny-action@a531616d8ce3b9177443e48a1159bc945a099823  # v2

  critical-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: guard
        run: CRITICAL_PATH_STRICT=1 ./scripts/check-critical-path.sh

  header-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: guard
        run: python3 scripts/check-ts-header.py

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - uses: taiki-e/install-action@e0eafa9a0d485c37f97c0f7beb930a58a2facbac  # v2
        with:
          tool: cargo-llvm-cov
      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang libclang-dev
      - name: coverage
        run: make coverage
      - uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e  # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: lcov.info
          format: lcov

  stress-smoke:
    name: stress smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang libclang-dev
      - name: build
        run: cargo build --release --bin tsoracle && cargo build --release -p stress
      - name: smoke (mem)
        run: cargo run --release -p stress -- run --topology mem --ci-smoke
      - name: smoke (raft)
        run: cargo run --release -p stress -- run --topology raft --ci-smoke --nodes 3
      - name: smoke (process)
        run: cargo run --release -p stress -- run --topology process --ci-smoke --nodes 1
      - name: positive control (inject-violation)
        # inject-violation deliberately breaks monotonicity and MUST exit 1;
        # any other exit code means the supervisor stopped catching the break.
        # `set +e` is required so `set -e` does not abort on the expected failure.
        run: |
          set +e
          cargo run --release -p stress -- inject-violation --topology mem
          code=$?
          set -e
          if [ "$code" != "1" ]; then
            echo "::error::inject-violation exited $code (expected 1)"
            exit 1
          fi
