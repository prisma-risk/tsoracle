name: release-images
on:
  push:
    tags: ['tsoracle-v*']     # the BINARY crate's release-plz tag ONLY (not per-crate library tags)
  pull_request:
    paths: ['deploy/**', 'crates/**', 'Cargo.*', '.github/workflows/release-images.yml']
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Throwaway suffix appended after 0.0.0- (default: test-<run_id>). Never publishes :latest.'
        type: string
        required: false
        default: ''

# Default to read-only. Only the jobs that push to ghcr.io
# (build-image, manifest, chart) opt into `packages: write`.
# build-image also writes release assets on tags.
permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.ver.outputs.v }}
    steps:
      - name: Resolve version
        id: ver
        env:
          SUFFIX: ${{ inputs.tag_suffix }}
          RUN_ID: ${{ github.run_id }}
          PR_NUM: ${{ github.event.number }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "v=${GITHUB_REF_NAME#tsoracle-v}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            SUFFIX="${SUFFIX:-test-${RUN_ID}}"
            if ! printf '%s' "$SUFFIX" | grep -Eq '^[A-Za-z0-9_.-]+$'; then
              echo "Invalid tag_suffix: must match ^[A-Za-z0-9_.-]+\$" >&2
              exit 1
            fi
            echo "v=0.0.0-${SUFFIX}" >> "$GITHUB_OUTPUT"
          else
            echo "v=0.0.0-pr${PR_NUM}" >> "$GITHUB_OUTPUT"
          fi

  # Compile each release variant natively, then pass the stripped binary and symbols to the image job as workflow artifacts.
  build-binary:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        variant: [file, openraft, umbrella]
        arch: [amd64, arm64]
        include:
          - variant: file
            features: file,metrics
            no_default_features: "true"
          - variant: openraft
            features: openraft,metrics
            no_default_features: "true"
          - variant: umbrella
            features: metrics
            no_default_features: "false"
          - arch: amd64
            machine: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Verify native build architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "$EXPECTED_MACHINE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake libclang-dev protobuf-compiler
      - name: Install repository Rust toolchain and llvm-strip
        run: |
          rustup component add llvm-tools-preview
          rustup show active-toolchain
      - name: Build and harden tsoracle binary (${{ matrix.variant }})
        env:
          FEATURES: ${{ matrix.features }}
          NO_DEFAULT_FEATURES: ${{ matrix.no_default_features }}
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          export RUSTFLAGS="--remap-path-prefix=$rustup_home=/rustup --remap-path-prefix=$cargo_home=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/build"
          build_args=(--release --locked -p tsoracle --bin tsoracle)
          if [ "$NO_DEFAULT_FEATURES" = "true" ]; then
            build_args+=(--no-default-features)
          fi
          build_args+=(--features "$FEATURES")
          cargo build "${build_args[@]}"

          binary=target/release/tsoracle
          home_hits="$(grep -aF -c "$HOME" "$binary" || true)"
          workspace_hits="$(grep -aF -c "$GITHUB_WORKSPACE" "$binary" || true)"
          printf 'runner home matches: %s\nworkspace matches: %s\n' "$home_hits" "$workspace_hits"
          test "$home_hits" -eq 0
          test "$workspace_hits" -eq 0

          mkdir -p dist
          symbols="tsoracle-${VARIANT}-${ARCH}-symbols.tar.gz"
          tar -C target/release -czf "dist/$symbols" tsoracle
          (cd dist && sha256sum "$symbols" > "$symbols.sha256")
          cp "$binary" dist/tsoracle
          host="$(rustc -vV | sed -n 's/^host: //p')"
          llvm_strip="$(rustc --print sysroot)/lib/rustlib/$host/bin/llvm-strip"
          test -x "$llvm_strip"
          "$llvm_strip" dist/tsoracle
      - name: Chart render smoke
        if: matrix.variant == 'umbrella' && matrix.arch == 'amd64'
        run: |
          helm lint deploy/charts/tsoracle
          sh deploy/charts/tsoracle/tests/render.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tsoracle-binary-${{ matrix.variant }}-${{ matrix.arch }}
          path: dist/tsoracle
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tsoracle-symbols-${{ matrix.variant }}-${{ matrix.arch }}
          path: |
            dist/tsoracle-${{ matrix.variant }}-${{ matrix.arch }}-symbols.tar.gz
            dist/tsoracle-${{ matrix.variant }}-${{ matrix.arch }}-symbols.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  build-image:
    needs: [version, build-binary]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # `variant` selects which driver subset is compiled into the binary.
        # Every published image includes the `metrics` feature so the stock
        # binary emits and exports the documented Prometheus signals.
        variant: [file, openraft, umbrella]
        arch: [amd64, arm64]
        include:
          - variant: file
            image: tsoracle-file
            description: 'tsoracle with the file driver — single-node timestamp & sequence oracle'
          - variant: openraft
            image: tsoracle-openraft
            description: 'tsoracle with the openraft driver — distributed, fault-tolerant timestamp & sequence oracle'
          - variant: umbrella
            image: tsoracle
            description: 'tsoracle with all drivers bundled (file, openraft & OmniPaxos) — distributed timestamp & sequence oracle'
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: tsoracle-binary-${{ matrix.variant }}-${{ matrix.arch }}
          path: artifacts
      # Symbols stay outside artifacts/, the only directory copied into the image.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: tsoracle-symbols-${{ matrix.variant }}-${{ matrix.arch }}
          path: symbols
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - name: Build per-arch image
        env:
          V: ${{ needs.version.outputs.v }}
          IMAGE: ${{ matrix.image }}
          DESC: ${{ matrix.description }}
        run: |
          test -f artifacts/tsoracle || { echo "artifacts/tsoracle missing" >&2; exit 1; }
          docker build \
            --platform linux/${{ matrix.arch }} \
            -f deploy/Dockerfile.release \
            --build-arg IMAGE_TITLE="$IMAGE" \
            --build-arg IMAGE_DESCRIPTION="$DESC" \
            -t "ghcr.io/prisma-risk/$IMAGE:${V}-${{ matrix.arch }}" .
      - name: Smoke stripped binary on the runtime base
        env:
          V: ${{ needs.version.outputs.v }}
          IMAGE: ${{ matrix.image }}
        run: docker run --rm --entrypoint tsoracle "ghcr.io/prisma-risk/$IMAGE:${V}-${{ matrix.arch }}" --help >/dev/null
      - name: Verify image architecture
        env:
          V: ${{ needs.version.outputs.v }}
          IMAGE: ${{ matrix.image }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(docker image inspect "ghcr.io/prisma-risk/$IMAGE:${V}-${{ matrix.arch }}" --format '{{.Architecture}}')" = "$EXPECTED_ARCH"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push per-arch image and record its digest
        env:
          V: ${{ needs.version.outputs.v }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          ref="ghcr.io/prisma-risk/$IMAGE:${V}-${{ matrix.arch }}"
          docker push "$ref"
          digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Invalid image digest: $digest" >&2
            exit 1
          fi
          mkdir -p release-metadata
          printf '%s@%s\n' "ghcr.io/prisma-risk/$IMAGE" "$digest" > "release-metadata/image-digest-${{ matrix.variant }}-${{ matrix.arch }}.txt"
      - name: Attach image digest and symbols to the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "GitHub release $TAG was not created" >&2
              exit 1
            fi
            sleep 2
          done
          gh release upload "$TAG" \
            "release-metadata/image-digest-${{ matrix.variant }}-${{ matrix.arch }}.txt" \
            "symbols/tsoracle-${{ matrix.variant }}-${{ matrix.arch }}-symbols.tar.gz" \
            "symbols/tsoracle-${{ matrix.variant }}-${{ matrix.arch }}-symbols.tar.gz.sha256" \
            --clobber

  manifest:
    needs: [version, build-image]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: [file, openraft, umbrella]
        include:
          - variant: file
            image: tsoracle-file
            description: 'tsoracle with the file driver — single-node timestamp & sequence oracle'
          - variant: openraft
            image: tsoracle-openraft
            description: 'tsoracle with the openraft driver — distributed, fault-tolerant timestamp & sequence oracle'
          - variant: umbrella
            image: tsoracle
            description: 'tsoracle with all drivers bundled (file, openraft & OmniPaxos) — distributed timestamp & sequence oracle'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest list
        env:
          V: ${{ needs.version.outputs.v }}
          IMAGE: ${{ matrix.image }}
          DESC: ${{ matrix.description }}
        run: |
          IMG=ghcr.io/prisma-risk/$IMAGE
          # `index:`-scoped annotations land on the manifest list itself. GHCR reads
          # the package-page description from the index annotation, NOT from the
          # per-arch config LABEL baked by the Dockerfile (imagetools create does not
          # copy child labels up), so this is the half that actually fixes the page.
          ANNOTATIONS=(
            --annotation "index:org.opencontainers.image.title=$IMAGE"
            --annotation "index:org.opencontainers.image.description=$DESC"
            --annotation "index:org.opencontainers.image.source=https://github.com/prisma-risk/tsoracle"
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0"
          )
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            docker buildx imagetools create "${ANNOTATIONS[@]}" \
              -t "$IMG:$V" -t "$IMG:latest" \
              "$IMG:$V-amd64" "$IMG:$V-arm64"
          else
            docker buildx imagetools create "${ANNOTATIONS[@]}" \
              -t "$IMG:$V" \
              "$IMG:$V-amd64" "$IMG:$V-arm64"
          fi

  chart:
    needs: version
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Push chart
        env:
          V: ${{ needs.version.outputs.v }}
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.15.0-linux-amd64.tar.gz | tar xz
          ./linux-amd64/helm package deploy/charts/tsoracle --version "$V" --app-version "$V"
          echo "${{ secrets.GITHUB_TOKEN }}" | ./linux-amd64/helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          ./linux-amd64/helm push "tsoracle-${V}.tgz" oci://ghcr.io/prisma-risk/charts
