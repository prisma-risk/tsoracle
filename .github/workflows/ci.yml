name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # fmt + clippy run as their own job so lint failures surface without waiting
  # behind the full workspace build and test suite. clippy stops at analysis
  # (no final link), but `--all-targets --all-features` still compiles a large
  # amount of code, so the same disk reclaim as build/test is applied for
  # headroom. rust-cache uses default per-job keying, so this job keeps a cache
  # independent of build/test.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - name: system deps
        timeout-minutes: 5
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f  # v1.6.1
        with:
          packages: protobuf-compiler clang libclang-dev
          version: 1
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # Compiles the full workspace (lib + bins) in parallel with lint and test.
  # Linking the debuginfo-heavy bins can hit the same ENOSPC-in-`ld` problem as
  # the test job, so the disk reclaim below runs first. rust-cache uses default
  # per-job keying, so this job keeps a cache independent of lint/test.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - name: system deps
        timeout-minutes: 5
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f  # v1.6.1
        with:
          packages: protobuf-compiler clang libclang-dev
          version: 1
      - name: build
        run: cargo build --workspace --all-features --locked

  test:
    runs-on: ubuntu-latest
    steps:
      # The workspace's debug+test binaries for the openraft + rocksdb crates
      # have grown past the ubuntu-latest runner's free disk budget — the
      # final link step in `cargo test --workspace --all-features` hits
      # ENOSPC inside `ld`. Stripping the pre-installed Android SDK / .NET /
      # Haskell toolchains frees ~30 GB before any cargo work begins; the
      # Rust toolchain installed below lives in ~/.cargo and is not touched
      # by `tool-cache: false`.
      - name: free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - name: system deps
        timeout-minutes: 5
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f  # v1.6.1
        with:
          packages: protobuf-compiler clang libclang-dev
          version: 1
      - name: test
        run: cargo test --workspace --all-features --locked

  # Validates `tsoracle-driver-file` (the only crate whose correctness depends on
  # OS-level primitives that differ across platforms — flock on Unix vs LockFileEx
  # on Windows, both reached through the `fs2` crate). Scoped to a single crate
  # so we don't pay rocksdb/openraft build costs on macOS and Windows runners,
  # and so a failure here clearly indicates a driver-level cross-platform bug
  # rather than an unrelated workspace dependency.
  cross-platform-driver-file:
    name: cross-platform / driver-file (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: cross-platform-driver-file-${{ matrix.os }}
      - name: build
        run: cargo build -p tsoracle-driver-file --all-features --locked
      # `--all-features` enables the `failpoints` feature, so this run covers
      # the unit tests, crash_recovery, lock, lock_child_abort, and failpoints
      # integration test binaries in a single invocation.
      - name: test
        run: cargo test -p tsoracle-driver-file --all-features --locked

  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99  # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: buf lint
        run: buf lint crates/tsoracle-proto/proto
      - name: buf format
        run: buf format --diff --exit-code crates/tsoracle-proto/proto
      - name: buf breaking
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/heads/${BASE_REF}"
          buf breaking crates/tsoracle-proto/proto \
            --against ".git#branch=${BASE_REF},subdir=crates/tsoracle-proto/proto"

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe  # v2
        with:
          rust-version: "1.88"

  critical-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: guard
        run: CRITICAL_PATH_STRICT=1 ./scripts/check-critical-path.sh

  header-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: guard
        run: python3 scripts/check-ts-header.py

  fuzz-lockfile:
    name: fuzz lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - name: check fuzz/Cargo.lock is in sync
        working-directory: fuzz
        run: |
          if ! cargo metadata --locked --format-version=1 > /dev/null 2>cargo-metadata.err; then
            cat cargo-metadata.err
            echo "::error::fuzz/Cargo.lock is stale. Run 'cargo update -w' (or 'cargo generate-lockfile') in fuzz/ and commit the result."
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest
    steps:
      # Coverage links every test binary with `-C instrument-coverage` and full
      # debuginfo, so the artifacts are even larger than the plain `test` job —
      # `make coverage` was hitting ENOSPC inside `ld` at the final link step.
      # Same reclaim as the `test` job: strip the pre-installed Android SDK /
      # .NET / Haskell toolchains (~30 GB) before any cargo work begins. The
      # Rust toolchain installed below lives in ~/.cargo and the rust-cache
      # restore is untouched by `tool-cache: false`.
      - name: free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - uses: taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5  # v2
        with:
          tool: cargo-llvm-cov
      - name: system deps
        timeout-minutes: 5
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f  # v1.6.1
        with:
          packages: protobuf-compiler clang libclang-dev
          version: 1
      - name: coverage
        run: make coverage
      - uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e  # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: lcov.info
          format: lcov

  stress-smoke:
    name: stress smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - name: system deps
        timeout-minutes: 5
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f  # v1.6.1
        with:
          packages: protobuf-compiler clang libclang-dev
          version: 1
      - name: build
        run: cargo build --release --bin tsoracle && cargo build --release -p stress
      - name: smoke (mem)
        run: cargo run --release -p stress -- run --topology mem --ci-smoke
      - name: smoke (raft)
        run: cargo run --release -p stress -- run --topology raft --ci-smoke --nodes 3
      - name: smoke (paxos)
        run: cargo run --release -p stress -- run --topology paxos --ci-smoke --nodes 3
      - name: smoke (process)
        run: cargo run --release -p stress -- run --topology process --ci-smoke --nodes 1
      - name: positive control (inject-violation)
        # inject-violation deliberately breaks monotonicity and MUST exit 1;
        # any other exit code means the supervisor stopped catching the break.
        # `set +e` is required so `set -e` does not abort on the expected failure.
        run: |
          set +e
          cargo run --release -p stress -- inject-violation --topology mem
          code=$?
          set -e
          if [ "$code" != "1" ]; then
            echo "::error::inject-violation exited $code (expected 1)"
            exit 1
          fi
