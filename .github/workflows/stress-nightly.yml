name: stress (nightly)

on:
  schedule:
    # 03:00 UTC daily -- 1h after fuzz-nightly so they don't fight for runners.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      topology:
        description: "Topology (mem | raft | paxos | process | all)"
        required: false
        default: all
        type: string
      scenario:
        description: "Scenario name (or 'all')"
        required: false
        default: all
        type: string
      duration:
        description: "--duration value (humantime)"
        required: false
        default: 5m
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Default to read-only; the `stress` job opts into `issues: write` for
# auto-issue filing on failure.
permissions:
  contents: read

jobs:
  stress:
    name: ${{ matrix.topology }}/${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        topology:
          - mem
          - raft
          - paxos
          - process
        scenario:
          - steady
          - killer-loop
          - fence-stress
          - failpoint-cycle
          - random-1
          - random-2
          - random-3
    steps:
      - id: filter
        name: Determine whether this matrix cell should run
        env:
          EVENT_NAME: ${{ github.event_name }}
          MATRIX_TOPOLOGY: ${{ matrix.topology }}
          MATRIX_SCENARIO: ${{ matrix.scenario }}
          REQUESTED_TOPOLOGY: ${{ github.event.inputs.topology }}
          REQUESTED_SCENARIO: ${{ github.event.inputs.scenario }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] \
            && { [[ "$REQUESTED_TOPOLOGY" != "all" && "$REQUESTED_TOPOLOGY" != "$MATRIX_TOPOLOGY" ]] \
              || [[ "$REQUESTED_SCENARIO" != "all" && "$REQUESTED_SCENARIO" != "$MATRIX_SCENARIO" ]]; }; then
            echo "Skipping ${MATRIX_TOPOLOGY}/${MATRIX_SCENARIO} (dispatch requested ${REQUESTED_TOPOLOGY}/${REQUESTED_SCENARIO})"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The release build pulls in rocksdb/openraft; reclaim ~30 GB up front to
      # keep headroom for the link step. Gated on the same filter as the build
      # below so skipped matrix cells stay no-ops; tool-cache: false leaves
      # ~/.cargo and the rust-cache restore untouched.
      - name: free disk space
        if: steps.filter.outputs.skip != 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        if: steps.filter.outputs.skip != 'true'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        if: steps.filter.outputs.skip != 'true'
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        if: steps.filter.outputs.skip != 'true'

      - name: system deps
        if: steps.filter.outputs.skip != 'true'
        timeout-minutes: 5
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f  # v1.6.1
        with:
          packages: protobuf-compiler clang libclang-dev
          version: 1

      - name: build
        if: steps.filter.outputs.skip != 'true'
        run: cargo build --release --bin tsoracle && cargo build --release -p stress --features stress-failpoints

      - name: Determine scenario args
        id: args
        if: steps.filter.outputs.skip != 'true'
        env:
          SCENARIO: ${{ matrix.scenario }}
          REQUESTED_DURATION: ${{ github.event.inputs.duration }}
        run: |
          # Seeded random scenarios pin determinism via --seed N (the harness
          # switches ScenarioKind to Random whenever --seed is nonzero, so the
          # --scenario value is irrelevant in that branch).
          case "$SCENARIO" in
            random-1) ARGS="--scenario random --seed 1" ;;
            random-2) ARGS="--scenario random --seed 2" ;;
            random-3) ARGS="--scenario random --seed 3" ;;
            *)        ARGS="--scenario $SCENARIO" ;;
          esac
          DUR="${REQUESTED_DURATION:-5m}"
          echo "args=$ARGS --duration $DUR" >> "$GITHUB_OUTPUT"

      - name: Run stress
        id: stress
        if: steps.filter.outputs.skip != 'true'
        env:
          TOPOLOGY: ${{ matrix.topology }}
          ARGS: ${{ steps.args.outputs.args }}
        run: |
          set +e
          # `tsoracle serve` is single-node; the process topology spawns one
          # binary and exercises SIGKILL/respawn against the file driver's
          # persisted high water. The shared --nodes default of 3 fits raft
          # but would manufacture incoherent clock baselines under process.
          case "$TOPOLOGY" in
            process) NODES_ARG="--nodes 1" ;;
            *)       NODES_ARG="" ;;
          esac
          # ARGS and NODES_ARG are intentionally word-split here.
          # shellcheck disable=SC2086
          cargo run --release -p stress --features stress-failpoints -- \
            run --topology "$TOPOLOGY" \
            $ARGS \
            $NODES_ARG \
            --clients 32 --batch-size 4 \
            --json --schedule-out stress-schedule.json \
            > stress-report.json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload artifacts
        if: always() && steps.filter.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: stress-${{ matrix.topology }}-${{ matrix.scenario }}-${{ github.run_id }}
          path: |
            stress-report.json
            stress-schedule.json
          retention-days: 30
          if-no-files-found: warn

      - name: Auto-file deduplicated issue on failure
        if: failure() && steps.stress.outputs.exit_code != '0' && steps.filter.outputs.skip != 'true'
        uses: ./.github/actions/stress-auto-issue
        with:
          topology: ${{ matrix.topology }}
          scenario: ${{ matrix.scenario }}
          report-json: stress-report.json
          artifact-name: stress-${{ matrix.topology }}-${{ matrix.scenario }}-${{ github.run_id }}
          run-id: ${{ github.run_id }}
