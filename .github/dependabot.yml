version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    groups:
      fuzz:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(fuzz)"
