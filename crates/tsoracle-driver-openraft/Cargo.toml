[package]
name         = "tsoracle-driver-openraft"
description  = "openraft-backed ConsensusDriver for tsoracle"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[features]
default                = ["rocksdb-snapshot-store"]
# Enables `RocksdbSnapshotStore`, a `SnapshotStore` impl keyed in a
# caller-managed RocksDB column family. Pairs naturally with
# `openraft_toolkit::RocksdbLogStore` so one `Arc<DB>` covers both the
# raft log and the persisted snapshot. Default-on because the two example
# crates in this workspace both use the rocksdb-backed log store anyway;
# downstream consumers that want a custom snapshot backend can opt out via
# `default-features = false`.
rocksdb-snapshot-store = ["dep:rocksdb"]

[dependencies]
async-trait        = { workspace = true }
futures            = { workspace = true }
openraft           = { workspace = true }
postcard           = { workspace = true }
openraft-toolkit   = { path = "../openraft-toolkit" }
parking_lot        = { workspace = true }
rocksdb            = { workspace = true, optional = true }
serde              = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true }
tokio-stream       = { workspace = true }
tracing            = { workspace = true }
tsoracle-consensus = { path = "../tsoracle-consensus", version = "0.1.0" }
tsoracle-core      = { path = "../tsoracle-core", version = "0.1.0" }

[dev-dependencies]
anyhow           = { workspace = true }
openraft-toolkit = { path = "../openraft-toolkit", features = ["rocksdb-log-store", "test-fakes"] }
proptest         = { workspace = true }
rocksdb          = { workspace = true }
tempfile         = { workspace = true }
tokio            = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
