apiVersion: v1
kind: Service
metadata:
  name: tsoracle
  labels:
    app.kubernetes.io/name: tsoracle
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tsoracle
  ports:
    - name: tso
      port: 5051
      targetPort: tso
