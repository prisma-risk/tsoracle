[package]
name         = "tsoracle-paxos-toolkit"
description  = "Reusable OmniPaxos glue: RocksDB storage, lifecycle helpers, test fakes"
version      = "1.0.5"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme                 = "README.md"
authors.workspace      = true
documentation = "https://docs.rs/tsoracle-paxos-toolkit"
keywords      = ["omnipaxos", "paxos", "consensus", "rocksdb", "storage"]
categories    = ["asynchronous", "database-implementations"]

[package.metadata.docs.rs]
features     = ["rocksdb-storage"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default            = ["rocksdb-storage"]
rocksdb-storage    = ["dep:rocksdb"]
test-fakes         = []
failpoints         = ["tsoracle-failpoint/failpoints"]
metrics            = ["dep:metrics"]

[dependencies]
async-trait        = { workspace = true }
futures            = { workspace = true }
metrics            = { workspace = true, optional = true }
omnipaxos          = { workspace = true, features = ["serde"] }
parking_lot        = { workspace = true }
rocksdb            = { workspace = true, optional = true, features = ["multi-threaded-cf"] }
serde              = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true }
tokio-stream       = { workspace = true }
tracing            = { workspace = true }
tsoracle-codec     = { workspace = true }
tsoracle-consensus = { path = "../tsoracle-consensus", version = "2.2.0" }
tsoracle-core      = { path = "../tsoracle-core", version = "2.3.0" }
tsoracle-failpoint = { workspace = true }

[dev-dependencies]
metrics-util       = { workspace = true }
rocksdb            = { workspace = true }
tempfile           = { workspace = true }
tokio              = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[[test]]
name              = "failpoints"
path              = "tests/failpoints.rs"
required-features = ["failpoints", "rocksdb-storage"]

[[test]]
name              = "_smoke"
path              = "tests/_smoke.rs"
required-features = ["test-fakes"]

[[test]]
name              = "lifecycle"
path              = "tests/lifecycle.rs"
required-features = ["test-fakes"]

[[test]]
name              = "mem_network_negative"
path              = "tests/mem_network_negative.rs"
required-features = ["test-fakes"]

[[test]]
name              = "mem_network_smoke"
path              = "tests/mem_network_smoke.rs"
required-features = ["test-fakes"]

[[test]]
name              = "storage_conformance"
path              = "tests/storage_conformance.rs"
required-features = ["test-fakes", "rocksdb-storage"]
